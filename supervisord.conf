# Supervisord Configuration File for Hugging Face Spaces Multi-Process Container

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# ── PROCESS 1: NGINX GATEWAY (PORT 7860) ──────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── PROCESS 2: AUTH SERVICE (PORT 8001) ───────────────────────────────────────
[program:auth-service]
command=uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/auth-service
environment=ROOT_PATH="/auth",SECRET_KEY="super-secret-jwt-key-for-demo-microservices"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── PROCESS 3: USER SERVICE (PORT 8002) ───────────────────────────────────────
[program:user-service]
command=uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/app/user-service
environment=ROOT_PATH="/user",SECRET_KEY="super-secret-jwt-key-for-demo-microservices"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── PROCESS 4: TASK SERVICE (PORT 8003) ───────────────────────────────────────
[program:task-service]
command=uvicorn app.main:app --host 127.0.0.1 --port 8003
directory=/app/task-service
environment=ROOT_PATH="/task",SECRET_KEY="super-secret-jwt-key-for-demo-microservices"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
