# Nginx Main Configuration for Hugging Face Spaces Multi-Service Gateway
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gateway Server Listening on Port 7860 (Hugging Face Spaces Default Port)
    server {
        listen 7860;
        server_name localhost;

        # ── ROOT LANDING PAGE ──────────────────────────────────────────────────
        location / {
            default_type text/html;
            return 200 '
            <!DOCTYPE html>
            <html>
            <head>
                <title>FastAPI Microservices Ecosystem - HF Spaces Gateway</title>
                <style>
                    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
                    .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
                    h1 { color: #38bdf8; margin-top: 0; }
                    .service-link { display: block; padding: 12px; margin: 10px 0; background: #334155; border-radius: 8px; color: #38bdf8; text-decoration: none; font-weight: bold; }
                    .service-link:hover { background: #475569; }
                    code { background: #0f172a; padding: 4px 8px; border-radius: 4px; color: #f43f5e; }
                </style>
            </head>
            <body>
                <div class="card">
                    <h1>🚀 FastAPI Microservices Ecosystem</h1>
                    <p>All 3 microservices are operational inside Hugging Face Spaces behind Nginx Gateway (Port 7860):</p>
                    <a class="service-link" href="/auth/health" target="_blank">🔐 Auth Service Health Check (<code>/auth/health</code>)</a>
                    <a class="service-link" href="/auth/docs" target="_blank">📖 Auth Service Swagger OpenAPI Docs (<code>/auth/docs</code>)</a>
                    <a class="service-link" href="/user/health" target="_blank">👤 User Service Health Check (<code>/user/health</code>)</a>
                    <a class="service-link" href="/user/docs" target="_blank">📖 User Service Swagger OpenAPI Docs (<code>/user/docs</code>)</a>
                    <a class="service-link" href="/task/health" target="_blank">📋 Task Service Health Check (<code>/task/health</code>)</a>
                    <a class="service-link" href="/task/docs" target="_blank">📖 Task Service Swagger OpenAPI Docs (<code>/task/docs</code>)</a>
                </div>
            </body>
            </html>
            ';
        }

        # ── REVERSE PROXY 1: AUTHENTICATION SERVICE ───────────────────────────
        location /auth/ {
            proxy_pass http://127.0.0.1:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── REVERSE PROXY 2: USER PROFILE SERVICE ─────────────────────────────
        location /user/ {
            proxy_pass http://127.0.0.1:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── REVERSE PROXY 3: TASK MANAGEMENT SERVICE ──────────────────────────
        location /task/ {
            proxy_pass http://127.0.0.1:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
