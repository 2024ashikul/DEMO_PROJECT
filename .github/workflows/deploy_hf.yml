# GitHub Actions Workflow for Deployment
name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main  # Trigger deploy whenever code is pushed to main branch

jobs:
  # ── JOB 1: RUN TESTS FOR ALL SERVICES BEFORE DEPLOYMENT ─────────────────────
  test:
    name: Run Pytest Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, user-service, task-service]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt

      - name: 🧪 Run Pytest
        run: |
          cd ${{ matrix.service }}
          PYTHONPATH=. pytest tests/ -v

  # ── JOB 2: DEPLOY TO HUGGING FACE SPACES ────────────────────────────────────
  deploy:
    needs: [test]  # ONLY deploy if tests pass across all services!
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to push full git history

      - name: 🚀 Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure git credentials
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Add Hugging Face Space as a remote target
          git remote add hf https://ashikulislam2024:$HF_TOKEN@huggingface.co/spaces/ashikulislam2024/demo || true

          # 3. Force push code from GitHub main branch to Hugging Face main branch
          git push -f hf main || echo "Hugging Face sync skipped if HF_TOKEN is unset"